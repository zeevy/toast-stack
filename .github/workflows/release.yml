name: Release

on:
  release:
    types: [ published ]

# Least-privilege default for every job: these workflows only read the
# repo and upload artifacts, neither of which needs a writable token.
permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A changed gradle-wrapper.jar must not run before it is checked.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # JitPack builds the tag, so the tag must match the version in the build.
      - name: Check the tag matches the library version
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' toaststack/build.gradle.kts)
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match version $version in toaststack/build.gradle.kts"
            exit 1
          fi

      - name: Run full test suite
        run: ./gradlew :toaststack:testDebugUnitTest

      - name: Build release AAR
        run: ./gradlew :toaststack:assembleRelease

      - name: Verify publish
        run: ./gradlew :toaststack:publishReleasePublicationToMavenLocal

      # Releases in this repo are immutable once published, so the AAR cannot
      # be attached to the release. Keep it with the workflow run instead.
      - name: Upload release AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toaststack-release
          path: toaststack/build/outputs/aar/toaststack-release.aar

      # Signs the publication, zips it and sends it to the Central Portal API
      # (central.sonatype.com). Central publishes it once its checks pass;
      # this step waits for that and fails when Central rejects the bundle.
      - name: Publish to Maven Central
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./gradlew :toaststack:publishReleasePublicationToCentralBundleRepository
          version="${TAG#v}"
          (cd toaststack/build/central-bundle && zip -r ../central-bundle.zip "com/siliconcircuits/toaststack/$version")
          auth=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          api=https://central.sonatype.com/api/v1/publisher
          # No retry on the upload: a second upload of the same version fails.
          id=$(curl -sS --fail-with-body --max-time 300 -H "Authorization: Bearer $auth" \
            -F bundle=@toaststack/build/central-bundle.zip \
            "$api/upload?name=toaststack-$version&publishingType=AUTOMATIC") || { echo "$id"; exit 1; }
          echo "Deployment $id"
          for _ in $(seq 60); do
            sleep 20
            status=$(curl -sS --fail-with-body --retry 5 --max-time 60 -X POST \
              -H "Authorization: Bearer $auth" "$api/status?id=$id") || { echo "$status"; exit 1; }
            state=$(jq -r .deploymentState <<< "$status")
            echo "$state"
            case "$state" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) jq .errors <<< "$status"; exit 1 ;;
            esac
          done
          echo "Central did not finish its checks in 20 minutes. See deployment $id at central.sonatype.com."
          exit 1
