name: Release

on:
  release:
    types: [ published ]

# Least-privilege default for every job: these workflows only read the
# repo and upload artifacts, neither of which needs a writable token.
permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A changed gradle-wrapper.jar must not run before it is checked.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # JitPack builds the tag, so the tag must match the version in the build.
      - name: Check the tag matches the library version
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' toaststack/build.gradle.kts)
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match version $version in toaststack/build.gradle.kts"
            exit 1
          fi

      - name: Run full test suite
        run: ./gradlew :toaststack:testDebugUnitTest

      - name: Build release AAR
        run: ./gradlew :toaststack:assembleRelease

      - name: Verify publish
        run: ./gradlew :toaststack:publishReleasePublicationToMavenLocal

      # Releases in this repo are immutable once published, so the AAR cannot
      # be attached to the release. Keep it with the workflow run instead.
      - name: Upload release AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toaststack-release
          path: toaststack/build/outputs/aar/toaststack-release.aar
