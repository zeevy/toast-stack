name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default for every job: these workflows only read the
# repo and upload artifacts, neither of which needs a writable token.
permissions:
  contents: read

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A changed gradle-wrapper.jar must not run before it is checked.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build library
        run: ./gradlew :toaststack:assembleDebug :toaststack:assembleRelease

      - name: Run lint
        run: ./gradlew :toaststack:lintDebug

      - name: Run unit tests
        run: ./gradlew :toaststack:testDebugUnitTest

      - name: Build demo app
        run: ./gradlew :app:assembleDebug

      - name: Run demo app lint
        run: ./gradlew :app:lintDebug

      - name: Build demo app release with R8
        run: ./gradlew :app:assembleRelease

      # The same command as jitpack.yml, which builds what users download.
      - name: Verify publish to local Maven (the JitPack command)
        run: ./gradlew :toaststack:publishReleasePublicationToMavenLocal

      # consumer-check is an app on the oldest setup README "Requirements"
      # promises (AGP 8.6, Kotlin 2.0, compileSdk 35). It needs Gradle 8.
      - name: Set up Gradle 8.7 for the consumer check
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Build an app on the oldest supported setup
        run: gradle -p consumer-check assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: toaststack/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: |
            toaststack/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.html
