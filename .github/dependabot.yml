## Dependabot keeps Gradle, Kotlin, AndroidX, and GitHub Actions versions
## fresh. PRs land grouped (one per ecosystem per week) so review is light.

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      compose:
        patterns:
          - "androidx.compose*"
      test-libraries:
        patterns:
          - "org.junit*"
          - "org.robolectric:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
    # The library's runtime dependencies set the floor for apps that use it
    # (README "Requirements"). Take only patch updates for them; raise them
    # on purpose, together with the README and consumer-check.
    ignore:
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.activity:activity-compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.lifecycle:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.startup:startup-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - dependencies
      - gradle

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL fails when init and analyze run different versions, so bump
    # them in one PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - github-actions
